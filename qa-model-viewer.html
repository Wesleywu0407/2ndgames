<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA Model Viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141020;color:#fff;font:13px system-ui,sans-serif}
canvas{display:block}
#clips{position:fixed;left:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100vw - 32px);z-index:2}
#clips button{border:1px solid #b79358;background:#211a26;color:#fff;padding:8px 11px;border-radius:4px;cursor:pointer}
#clips button[aria-pressed="true"]{background:#b79358;color:#141020}
#status{position:fixed;left:16px;top:16px;z-index:2;padding:8px 10px;background:#141020cc;border:1px solid #ffffff22}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="status">LOADING…</div>
<div id="clips" aria-label="Animation clips"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const model = params.get('model') || 'assets/models/characters/hour-eater/hour-eater.glb';
const sources = (params.get('sources') || '').split(',').map(value => value.trim()).filter(Boolean);
const requestedClip = params.get('clip');
const status = document.getElementById('status');
const clipsPanel = document.getElementById('clips');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141020);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xbacaff, 0x1a1424, 2.4));
const key = new THREE.DirectionalLight(0xffd39a, 3); key.position.set(4, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x8f8cff, 2.4); rim.position.set(-5, 4, -4); scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
let mixer = null;
let currentAction = null;
const loader = new GLTFLoader();

function disposeLibraryScene(scene) {
  scene?.traverse?.(object => {
    object.geometry?.dispose?.();
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(Boolean).forEach(material => material.dispose?.());
  });
}

function playClip(clip, button) {
  const next = mixer.clipAction(clip);
  next.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(0.16).play();
  currentAction?.fadeOut(0.16);
  currentAction = next;
  for (const item of clipsPanel.querySelectorAll('button')) item.setAttribute('aria-pressed', String(item === button));
  status.textContent = `${clip.name} · ${clip.duration.toFixed(2)}s`;
}

loader.load(model, async gltf => {
  gltf.scene.updateMatrixWorld(true);
  const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
  const sourceSize = sourceBox.getSize(new THREE.Vector3());
  gltf.scene.scale.multiplyScalar(2.25 / Math.max(0.01, sourceSize.y));
  gltf.scene.updateMatrixWorld(true);
  const fittedBox = new THREE.Box3().setFromObject(gltf.scene);
  const center = fittedBox.getCenter(new THREE.Vector3());
  gltf.scene.position.set(-center.x, -fittedBox.min.y, -center.z);
  scene.add(gltf.scene);
  camera.position.set(2.5, 1.45, 5.6);
  controls.target.set(0, 1.08, 0);
  controls.update();
  const libraries = await Promise.all(sources.map(source => loader.loadAsync(source)));
  const animations = [...gltf.animations, ...libraries.flatMap(library => library.animations)];
  libraries.forEach(library => disposeLibraryScene(library.scene));
  mixer = new THREE.AnimationMixer(gltf.scene);
  for (const clip of animations) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = clip.name.replace(/^Armature\||\|baselayer$/g, '');
    button.addEventListener('click', () => playClip(clip, button));
    clipsPanel.appendChild(button);
    if (!currentAction && (!requestedClip || clip.name === requestedClip)) playClip(clip, button);
  }
  if (!animations.length) status.textContent = 'NO ANIMATIONS';
  document.title = 'QA Viewer — loaded';
}, undefined, err => { document.title = 'QA Viewer — ERROR'; console.error(err); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
